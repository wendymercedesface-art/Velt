name: VeltraX Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  android:
    name: Compilar APK de Android
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar componentes Android SDK
        run: sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Dar permisos al Gradle Wrapper
        run: chmod +x ./gradlew

      - name: Compilar APK debug
        run: ./gradlew :androidApp:assembleDebug --no-daemon --stacktrace

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: VeltraX-Android-APK
          path: androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error
