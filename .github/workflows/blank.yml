
name: Compilar VeltraX APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Preparar proyecto
        run: |
          mkdir source
          unzip -q VeltraX_Android_Fix_SDK.zip -d source
          ls -la source
          test -f source/VeltraX_Nativo/gradlew

      - name: Instalar SDK
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Compilar APK
        working-directory: source/VeltraX_Nativo
        run: |
          chmod +x gradlew
          ./gradlew :androidApp:assembleDebug --no-daemon

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: VeltraX-APK
          path: source/VeltraX_Nativo/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
          
